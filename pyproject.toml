[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-workbench"
version = "1.0.0"
description = "A privacy-first local AI agent with tools, memory, skills, and managed workspaces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sean Widner" }]
keywords = ["ai", "agent", "ollama", "local-llm", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
media = ["edge-tts>=6.1"]
dev = ["ruff>=0.6"]

[project.scripts]
local-agent = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["local_agent*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B904", "UP031"]
